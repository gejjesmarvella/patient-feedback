<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#087f8c"><title>Patient Feedback</title>
<style>
:root{--teal:#087f8c;--deep:#075b63;--mint:#e8f7f4;--ink:#15343a;--muted:#61777b;--line:#d7e7e5;--white:#fff;--danger:#b42318}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:#f3faf9}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#app{min-height:100vh;display:flex;flex-direction:column}.kiosk{min-height:100vh;padding:clamp(16px,4vw,40px);display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#e4f8f4,#f7fbfb 62%)}
.panel{width:min(100%,850px);background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,48px);box-shadow:0 18px 55px #0b555411;text-align:center}
.clinic-logo{display:block;width:min(100%,360px);height:auto;max-height:125px;object-fit:contain;margin:0 auto 18px}.admin-logo{width:min(100%,230px);max-height:76px;object-fit:contain;display:block}\n.brand{font-size:clamp(27px,5vw,42px);font-weight:800;color:var(--deep);margin:0 0 10px}.sub{font-size:clamp(18px,2.5vw,22px);color:var(--muted);margin:0 0 28px}
.bigbtn{min-height:76px;width:100%;border:0;border-radius:18px;background:var(--teal);color:white;font-size:clamp(21px,3vw,26px);font-weight:750;padding:18px;margin:10px 0;box-shadow:0 7px 0 #075b63}.bigbtn.alt{background:#16866e;box-shadow:0 7px 0 #0b6653}.bigbtn:active{transform:translateY(3px);box-shadow:0 4px 0 #075b63}
.question{font-size:clamp(25px,4vw,36px);font-weight:750;line-height:1.25;margin:12px auto 28px;max-width:720px}.progress{height:10px;background:#e5efee;border-radius:99px;overflow:hidden;margin:0 0 24px}.progress>div{height:100%;background:#11a38d;width:0;transition:width .2s}
.answers{display:flex;justify-content:center;gap:clamp(8px,2vw,18px);flex-wrap:wrap;margin:22px 0 28px}.answer{min-width:72px;min-height:78px;padding:12px;border:2px solid var(--line);border-radius:18px;background:#fff;font-size:34px;color:var(--ink)}.answer.selected{border-color:var(--teal);background:var(--mint);box-shadow:0 0 0 3px #087f8c22}.answer .small{display:block;font-size:15px;font-weight:650;margin-top:4px}.stars .answer{font-size:42px;min-width:68px}.comment{width:100%;min-height:150px;border:2px solid var(--line);border-radius:16px;padding:18px;font-size:20px;resize:vertical}.nav{display:flex;gap:12px;margin-top:18px}.nav button{flex:1;min-height:68px;border:0;border-radius:15px;font-size:21px;font-weight:750}.back{background:#e9f1f0;color:var(--ink)}.next{background:var(--teal);color:#fff}.hint{font-size:16px;color:var(--muted)}.thanks{font-size:clamp(28px,5vw,42px);font-weight:800;color:var(--deep)}.count{font-size:22px;color:var(--muted);margin-top:20px}
#adminApp{padding:20px;max-width:1400px;margin:auto}.adminHead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.adminHead h1{margin:0;color:var(--deep)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button,.smallbtn{border:1px solid var(--line);border-radius:10px;padding:11px 15px;background:#fff;color:var(--ink);font-weight:650}.tabs button.active{background:var(--teal);color:white}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #0b555408}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{font-size:30px;font-weight:800;color:var(--deep)}label{display:block;font-weight:650;margin:10px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #cbdcda;border-radius:9px;background:white;color:var(--ink);font-size:16px}textarea{min-height:80px}.primary{background:var(--teal);color:white;border:0;border-radius:9px;padding:12px 17px;font-weight:750}.danger{background:#fff0ee;color:var(--danger);border:1px solid #f0c4bf;border-radius:9px;padding:10px 14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}th{background:#f0f8f7;position:sticky;top:0} .muted{color:var(--muted)}.status{font-size:14px;color:var(--muted)}.error{color:var(--danger)}.success{color:#087b55}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#163b40;color:white;padding:12px 18px;border-radius:12px;z-index:9;max-width:90vw}
@media(max-width:600px){#adminApp{padding:12px}.panel{border-radius:20px}.nav button{min-height:64px}.answers{gap:7px}.answer{min-width:62px}}
</style></head>
<body><div id="app"></div><div id="toast" class="hidden"></div>

 const j=await r.json();if(!j.ok)throw new Error(j.error||"Request failed");return j;
}
async function loadPublic(){
 try{const r=await api("getPublic");state.config={...state.config,...r.config};state.questions=r.questions;localStorage.setItem("pf_questions",JSON.stringify(state.questions));localStorage.setItem("pf_config",JSON.stringify(state.config));}
 catch(e){const q=localStorage.getItem("pf_questions"),c=localStorage.getItem("pf_config");if(q)state.questions=JSON.parse(q);if(c)state.config={...state.config,...JSON.parse(c)};if(!state.questions.length)toast("Offline and no saved questions are available yet.");}

function setActivity(){state.lastActivity=Date.now();state.timeoutPrompt=false}
["click","touchstart","keydown","input"].forEach(e=>document.addEventListener(e,()=>{if(state.mode==="kiosk")setActivity()},{passive:true}));

async function submitFeedback(){if(state.submitted)return;state.submitted=true;const payload={doctor:state.doctor,answers:state.questions.map(q=>({id:q.id,text:q.text,type:q.type,value:state.answers[keyFor(q)]??""}))};
 const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),payload,created:Date.now()};

function showThanks(message){app.innerHTML=`<section class="panel"><div class="thanks">✓ Thank you!</div><p class="sub">${esc(message||state.config.thankYou)}</p><div class="count">Returning to start in <strong id="count">${Number(state.config.countdown)||5}</strong> seconds</div></section>`;

function saveQueue(){localStorage.setItem("pf_pending",JSON.stringify(state.pending))}
function loadQueue(){try{state.pending=JSON.parse(localStorage.getItem("pf_pending")||"[]")}catch{state.pending=[]}}
async function syncQueue(){if(!navigator.onLine||!state.pending.length)return;const keep=[];for(const item of state.pending){try{await api("submit",item.payload)}catch(e){keep.push(item)}}state.pending=keep;saveQueue();if(state.mode==="admin")$("#pendingCount")?.replaceChildren(document.createTextNode("Pending sync: "+state.pending.length))}

 $("#logout").onclick=()=>{sessionStorage.removeItem("pf_admin_token");state.token="";renderAdmin()};app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.adminTab=b.dataset.tab;renderAdmin()});}
function renderAdmin(){state.mode="admin";if(!state.token){renderLogin();return}if(state.adminTab==="questions")renderQuestions();else if(state.adminTab==="settings")renderSettings();else renderResults()}
function renderLogin(){app.className="kiosk";app.innerHTML=`<section class="panel"><h1 class="brand">Staff Login</h1><p class="sub">Enter the administrator PIN</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Admin PIN" style="font-size:24px;text-align:center;max-width:300px"><p><button class="bigbtn" id="login">Sign in</button></p><p class="hint">Staff access only</p></section>`;$("#login").onclick=async()=>{try{const r=await api("login",{pin:$("#pin").value});state.token=r.token;sessionStorage.setItem("pf_admin_token",state.token);state.adminTab="results";renderAdmin()}catch(e){toast(e.message)}};$("#pin").onkeydown=e=>{if(e.key==="Enter")$("#login").click()}}
async function adminCall(action,data={}){return api(action,data,true)}
async function renderQuestions(){try{const r=await adminCall("adminGetQuestions");state.adminQuestions=r.questions;const d=state.adminDoctor;const qs=state.adminQuestions.filter(q=>q.doctor===d).sort((a,b)=>a.order-b.order);adminShell(`<div class="row"><label>Department<select id="qDoctor"><option>Plastic Surgery</option><option>Dermatology</option></select></label><button class="primary" id="addQ">+ Add question</button></div><div id="qList"></div>`);$("#qDoctor").value=d;$("#qDoctor").onchange=()=>{state.adminDoctor=$("#qDoctor").value;renderQuestions()};$("#addQ").onclick=()=>editQuestion({doctor:d,text:"",type:"star",required:true,active:true,order:qs.length+1});$("#qList").innerHTML=qs.map((q,i)=>`<div class="card row"><div style="flex:4"><strong>${esc(q.text)}</strong><div class="muted">${esc(q.type)} · ${q.required?"Required":"Optional"} · ${q.active?"Active":"Inactive"}</div></div><button class="smallbtn" data-edit="${esc(q.id)}">Edit</button><button class="smallbtn" data-up="${esc(q.id)}">↑</button><button class="smallbtn" data-down="${esc(q.id)}">↓</button><button class="danger" data-del="${esc(q.id)}">Delete</button></div>`).join("")||"<p>No questions yet.</p>";
 qs.forEach(q=>{$(`[data-edit="${CSS.escape(q.id)}"]`).onclick=()=>editQuestion(q);$(`[data-up="${CSS.escape(q.id)}"]`).onclick=()=>moveQuestion(q.id,-1);$(`[data-down="${CSS.escape(q.id)}"]`).onclick=()=>moveQuestion(q.id,1);$(`[data-del="${CSS.escape(q.id)}"]`).onclick=()=>deleteQuestion(q.id)});}
 catch(e){toast(e.message);if(/session|token/i.test(e.message)){state.token="";renderAdmin()}}}
async function editQuestion(q){const text=prompt("Question text",q.text);if(text===null)return;if(!text.trim()){toast("Question text is required.");return}const type=prompt("Type: star, smiley, or comment",q.type||"star");if(!["star","smiley","comment"].includes(type)){toast("Invalid type.");return}const required=confirm("Make this question required?");const active=confirm("Keep this question active?");try{await adminCall("saveQuestion",{question:{...q,text:text.trim(),type,required,active}});toast("Question saved.");renderQuestions()}catch(e){toast(e.message)}}
async function moveQuestion(id,delta){const qs=state.adminQuestions.filter(q=>q.doctor===state.adminDoctor).sort((a,b)=>a.order-b.order),i=qs.findIndex(q=>q.id===id),j=i+delta;if(j<0||j>=qs.length)return;try{await adminCall("reorderQuestions",{ids:qs.map((q,k)=>k===i?qs[j].id:k===j?qs[i].id:q.id)});renderQuestions()}catch(e){toast(e.message)}}
async function deleteQuestion(id){if(!confirm("Delete this question? Existing response columns and history will be retained."))return;try{await adminCall("deleteQuestion",{id});toast("Question deleted.");renderQuestions()}catch(e){toast(e.message)}}
async function renderResults(){try{const r=await adminCall("getResults",{doctor:$("#filterDoctor")?.value||"All",from:$("#from")?.value||"",to:$("#to")?.value||""});state.allResponses=r.responses;const stats=r.stats;adminShell(`<div class="card"><div class="row"><label>Department<select id="filterDoctor"><option>All</option><option>Plastic Surgery</option><option>Dermatology</option></select></label><label>From<input type="date" id="from"></label><label>To<input type="date" id="to"></label><button class="primary" id="filter">Apply</button></div></div><div class="grid"><div class="card"><div class="muted">Total responses</div><div class="metric">${stats.total}</div></div><div class="card"><div class="muted">Average rating</div><div class="metric">${stats.average||"—"}</div></div><div class="card"><div class="muted">Pending sync</div><div class="metric">${state.pending.length}</div></div></div><div class="card"><h3>Rating by question</h3><div id="ratingStats"></div></div><div class="card"><h3>Response trend</h3><div id="trend"></div></div><div class="card"><div class="row"><h3>Responses</h3><input id="searchRows" placeholder="Search responses or comments"></div><div class="row"><button class="smallbtn" id="openSheet">Open Google Sheet</button><button class="smallbtn" id="csv">Download CSV</button><button class="smallbtn" id="xlsx">Download Excel (.xlsx)</button><button class="danger" id="clearAll">Clear all responses</button></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div>`);$("#filterDoctor").value=$("#filterDoctor")?.value||"All";$("#filter").onclick=renderResults;$("#openSheet").onclick=()=>adminCall("getSheetUrl").then(x=>window.open(x.url,"_blank"));$("#csv").onclick=downloadCSV;$("#xlsx").onclick=downloadXLSX;$("#clearAll").onclick=clearAll;renderResultData(r);$("#searchRows").oninput=()=>renderTable(state.allResponses,$("#searchRows").value);}
 catch(e){toast(e.message);if(/session|token/i.test(e.message)){state.token="";renderAdmin()}}}
function renderResultData(r){$("#ratingStats").innerHTML=(r.questionStats||[]).map(s=>`<p>${esc(s.doctor)} · ${esc(s.question)}: <strong>${s.average||"—"}</strong> (${s.count} responses)</p>`).join("")||"No rating data yet.";const points=r.trend||[];const w=700,h=180,max=Math.max(1,...points.map(p=>p.count));const coords=points.map((p,i)=>`${points.length<2?0:i/(points.length-1)*w},${h-p.count/max*(h-20)}`).join(" ");$("#trend").innerHTML=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Response trend"><polyline points="${coords}" fill="none" stroke="#087f8c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${points.map((p,i)=>`<text x="${points.length<2?0:i/(points.length-1)*w}" y="${h-2}" font-size="11" text-anchor="middle" fill="#61777b">${esc(p.day.slice(5))}</text>`).join("")}</svg>`;renderTable(r.responses,"");}
function renderTable(rows,term){const filtered=rows.filter(r=>JSON.stringify(r).toLowerCase().includes((term||"").toLowerCase()));$("#thead").innerHTML="<tr><th>Timestamp</th><th>Department</th><th>Answers / comments</th><th>Action</th></tr>";$("#tbody").innerHTML=filtered.map(r=>`<tr><td>${esc(new Date(r.timestamp).toLocaleString())}</td><td>${esc(r.doctor)}</td><td>${Object.entries(r.answers||{}).map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join("")}</td><td><button class="danger" data-rid="${esc(r.id)}">Delete</button></td></tr>`).join("")||`<tr><td colspan="4">No matching responses.</td></tr>`;filtered.forEach(r=>$(`[data-rid="${CSS.escape(r.id)}"]`).onclick=()=>deleteResponse(r.id))}
async function deleteResponse(id){if(!confirm("Delete this response permanently?"))return;try{await adminCall("deleteResponse",{id});toast("Response deleted.");renderResults()}catch(e){toast(e.message)}}
async function clearAll(){if(!confirm("Delete ALL responses? This cannot be undone."))return;if(!confirm("Final confirmation: permanently clear both department response sheets?"))return;try{await adminCall("clearAll");toast("All responses cleared.");renderResults()}catch(e){toast(e.message)}}
function downloadCSV(){const rows=state.allResponses,keys=[...new Set(rows.flatMap(r=>Object.keys(r.answers||{})))],data=[["Timestamp","Department",...keys],...rows.map(r=>[new Date(r.timestamp).toISOString(),r.doctor,...keys.map(k=>r.answers?.[k]??"")])];const csv=data.map(row=>row.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");downloadBlob(csv,"patient-feedback.csv","text/csv;charset=utf-8")}
function downloadXLSX(){if(!window.XLSX){toast("Excel library is unavailable. Check internet connection.");return}const rows=state.allResponses;const data=rows.map(r=>({Timestamp:new Date(r.timestamp),Department:r.doctor,...r.answers}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),"Responses");XLSX.writeFile(wb,"patient-feedback.xlsx")}
function downloadBlob(data,name,type){const a=document.createElement("a"),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
async function renderSettings(){try{const r=await adminCall("getSettings");adminShell(`<div class="card"><h3>Clinic settings</h3><label>Clinic name</label><input id="clinicName" maxlength="100"><label>Thank-you message</label><textarea id="thankYou" maxlength="300"></textarea><div class="grid"><div><label>Countdown seconds</label><input id="countdown" type="number" min="1" max="60"></div><div><label>Inactivity timeout (seconds)</label><input id="timeout" type="number" min="15" max="600"></div></div><p><button class="primary" id="saveSettings">Save settings</button></p></div><div class="card"><h3>Change administrator PIN</h3><label>Current PIN</label><input id="oldPin" type="password"><label>New PIN (6–12 digits recommended)</label><input id="newPin" type="password"><p><button class="primary" id="changePin">Change PIN</button></p></div>`);$("#clinicName").value=r.config.clinicName;$("#thankYou").value=r.config.thankYou;$("#countdown").value=r.config.countdown;$("#timeout").value=r.config.timeout;$("#saveSettings").onclick=async()=>{try{await adminCall("saveSettings",{config:{clinicName:$("#clinicName").value,thankYou:$("#thankYou").value,countdown:Number($("#countdown").value),timeout:Number($("#timeout").value)}});toast("Settings saved.");loadPublic()}catch(e){toast(e.message)}};$("#changePin").onclick=async()=>{try{await adminCall("changePin",{oldPin:$("#oldPin").value,newPin:$("#newPin").value});$("#oldPin").value=$("#newPin").value="";toast("PIN changed.")}catch(e){toast(e.message)}};}catch(e){toast(e.message)}}
if(state.mode==="admin"){const x=document.createElement("script");x.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";document.head.appendChild(x);renderAdmin()}else{loadPublic().finally(renderKiosk)}
</script></body></html>
